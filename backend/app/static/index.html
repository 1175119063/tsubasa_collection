<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>翼·时光记 · 鸟类探索日志</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260816-4" />
  </head>
  <body>
    <div class="paper-noise"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">羽</span>
        <span><strong>翼·时光记</strong><small>鸟类探索日志</small></span>
      </a>
      <a class="primary-button button-link" href="/observations?new=1">＋ 新增观察</a>
    </header>

    <main>
      <section class="hero home-hero">
        <div>
          <p class="eyebrow">PERSONAL ORNITHOLOGY ARCHIVE</p>
          <h1>记录只属于你的探索<br />收集每一支散落的飞羽</h1>
          <p class="hero-copy">照片、地点与时间留在本地，逐渐组成只属于你的鸟类图鉴。</p>
          <p id="home-status" class="field-hint"></p>
        </div>
        <div class="stats" aria-label="馆藏统计">
          <article><strong id="species-count">0</strong><span>已收录物种</span></article>
          <article><strong id="observation-count">0</strong><span>观察记录</span></article>
          <article><strong id="audio-count">0</strong><span>声音标本</span></article>
        </div>
      </section>

      <nav class="home-portals home-portals-large" aria-label="首页功能入口">
        <a href="/observations" class="portal-card">
          <span class="portal-index">01</span>
          <span><strong>观察记录</strong><small>检视、上传和管理每一次拍摄</small></span>
          <b>→</b>
        </a>
        <a href="/dex" class="portal-card">
          <span class="portal-index">02</span>
          <span><strong>个人图鉴</strong><small>浏览已经入藏的物种与收集证明</small></span>
          <b>→</b>
        </a>
        <a href="/locations" class="portal-card">
          <span class="portal-index">03</span>
          <span><strong>地点浏览</strong><small>浏览观鸟地点、到访日与地点物种记录</small></span>
          <b>→</b>
        </a>
        <a href="/trips" class="portal-card">
          <span class="portal-index">04</span>
          <span><strong>观鸟行程</strong><small>整理一次外出中的观察、物种与路线时间</small></span>
          <b>→</b>
        </a>
      </nav>
    </main>

    <script src="/static/core.js?v=20260815-1" defer></script>
    <script src="/static/home.js?v=20260815-1" defer></script>
  </body>
</html>
