<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>田野记录 · 翼·时光记</title><link rel="stylesheet" href="/static/styles.css?v=20260819-2" /><link rel="stylesheet" href="/static/v2.css?v=20260819-2" /><link rel="stylesheet" href="/static/assistant.css?v=20260825-4" />
  </head>
  <body class="v2-page" data-page="observations">
    <div class="v2-grain" aria-hidden="true"></div>
    <header class="v2-topbar">
      <a class="v2-brand" href="/"><span class="v2-brand-seal"><img src="/static/assets/wing-chronicle-logo.png?v=20260816-1" alt="" aria-hidden="true" /></span><span><strong>翼·时光记</strong><small>EXPLORER'S FIELD JOURNAL</small></span></a>
      <nav class="v2-topnav"><a href="/">探索营地</a><a href="/dex">鸟类调查册</a><a class="is-active" href="/observations">田野记录</a><a href="/locations">区域档案</a><a href="/trips">远征日志</a></nav>
      <a class="v2-stable-link" href="/legacy/observations">旧版备用入口</a>
    </header>
    <main class="v2-archive-layout">
      <aside class="v2-archive-sidebar"><div class="v2-book-tab">FIELD NOTES</div><p class="v2-kicker">野外调查手记</p><h1>田野记录</h1><p class="v2-filter-intro">按拍摄月份翻阅每一次真实相遇。照片、时间与地点共同构成调查凭证。</p>
        <label for="v2-observation-year">年份</label><select id="v2-observation-year"><option value="">全部年份</option></select>
        <label for="v2-observation-month">月份</label><select id="v2-observation-month"><option value="">全部月份</option></select>
        <label for="v2-observation-location">调查区域</label><select id="v2-observation-location"><option value="">全部区域</option></select>
        <label for="v2-observation-sort">装订顺序</label><select id="v2-observation-sort"><option value="asc">从早到晚</option><option value="desc">从晚到早</option></select>
        <button class="v2-filter-reset" id="v2-observation-reset" type="button">清除检索条件</button>
        <div class="v2-book-count"><strong id="v2-observation-count">—</strong><span>页田野记录</span></div>
      </aside>
      <section class="v2-archive-content"><header class="v2-dex-header"><div><p class="v2-kicker">按时间装订</p><h2>沿着日期重返现场</h2></div><button class="v2-new-entry" id="new-record-button" type="button">＋ 登记新发现</button></header><div id="v2-observation-groups" class="v2-record-groups"><p class="v2-loading">正在整理田野手记…</p></div><div class="v2-empty" id="v2-observation-empty" hidden><strong>没有符合条件的记录</strong><span>换一个月份或区域试试。</span></div></section>
    </main>
    <dialog class="v2-archive-dialog" id="v2-observation-dialog"><button class="v2-dossier-close" type="button" aria-label="关闭">×</button><div id="v2-observation-detail"></div></dialog>
    <dialog id="record-dialog" class="record-dialog">
      <form id="record-form">
        <header class="dialog-header"><div><p class="eyebrow">NEW OBSERVATION</p><h2>登记新的田野记录</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></header>
        <div class="form-scroll">
          <fieldset><legend><span>01</span> 目标物种</legend>
            <div class="full-field species-search-field"><label for="species-search">搜索已有图鉴物种</label><div class="species-search-control"><input id="species-search" type="search" placeholder="输入馆藏编号、中文名、拉丁学名、科名或属名" autocomplete="off" aria-controls="species-search-results" /><div id="species-search-results" class="species-search-results" role="listbox" hidden></div></div><span id="species-search-status" class="field-hint"></span><div id="species-selection-summary" class="species-selection-summary" hidden><span><small>已选择</small><strong id="species-selection-text"></strong></span><button id="change-species-selection" type="button">重新选择</button></div></div>
            <label class="full-field">选择图鉴物种<select id="species-select" name="species-select"></select></label>
            <div id="new-species-fields" class="form-grid taxonomy-fields">
              <div class="taxonomy-node full-field"><label for="order-node-search">搜索已有目</label><div class="species-search-control taxonomy-search-control"><input id="order-node-search" type="search" placeholder="输入目中文名或拉丁学名" autocomplete="off" aria-controls="order-node-results" /><div id="order-node-results" class="species-search-results" role="listbox" hidden></div></div><span id="order-node-status" class="field-hint"></span><label><span class="step-label">1 · 目</span><select id="order-node-select" name="order_node"></select></label><div id="order-new-fields" class="node-new-grid"><label>目中文名<input name="order_chinese" autocomplete="off" /></label><label>目拉丁学名<input name="order_scientific" autocomplete="off" /></label></div></div>
              <div class="taxonomy-node full-field"><label for="family-node-search">搜索当前目下的科</label><div class="species-search-control taxonomy-search-control"><input id="family-node-search" type="search" placeholder="先选择目，再输入科中文名或拉丁学名" autocomplete="off" aria-controls="family-node-results" /><div id="family-node-results" class="species-search-results" role="listbox" hidden></div></div><span id="family-node-status" class="field-hint"></span><label><span class="step-label">2 · 科</span><select id="family-node-select" name="family_node"></select></label><div id="family-new-fields" class="node-new-grid"><label>科中文名<input name="family_chinese" autocomplete="off" /></label><label>科拉丁学名<input name="family_scientific" autocomplete="off" /></label></div></div>
              <div class="taxonomy-node full-field"><label for="genus-node-search">搜索当前科下的属</label><div class="species-search-control taxonomy-search-control"><input id="genus-node-search" type="search" placeholder="先选择科，再输入属中文名或拉丁学名" autocomplete="off" aria-controls="genus-node-results" /><div id="genus-node-results" class="species-search-results" role="listbox" hidden></div></div><span id="genus-node-status" class="field-hint"></span><label><span class="step-label">3 · 属</span><select id="genus-node-select" name="genus_node"></select></label><div id="genus-new-fields" class="node-new-grid"><label>属中文名<input name="genus_chinese" autocomplete="off" /></label><label>属拉丁学名<input name="genus_scientific" autocomplete="off" /></label></div></div>
              <label><span class="step-label">4 · 种中文名</span><input name="species_chinese" autocomplete="off" /></label><label><span class="step-label">4 · 种拉丁学名</span><input name="species_scientific" placeholder="例如 Alcedo atthis" autocomplete="off" /></label>
              <label>IUCN 等级<select name="iucn_status"><option>NE</option><option>LC</option><option>NT</option><option>VU</option><option>EN</option><option>CR</option><option>EW</option><option>EX</option></select></label>
              <label>中国保护等级<select name="china_status"><option value="">无</option><option value="three_protected">三有</option><option value="level_2">二级</option><option value="level_1">一级</option></select></label>
              <label class="check-field full-field"><input id="has-subspecies" name="has_subspecies" type="checkbox" /><span>该物种存在亚种</span></label><label id="subspecies-list-field" class="full-field" hidden>完整亚种名单<textarea name="subspecies_list" rows="3" placeholder="每行一个：拉丁学名 | 可选中文名"></textarea></label>
            </div>
          </fieldset>
          <fieldset><legend><span>02</span> 照片与个体</legend><div class="form-grid">
            <label class="full-field file-field">JPEG/JPG 照片（不超过 10 MB）<input id="photo-input" name="photo" type="file" accept="image/jpeg,.jpg,.jpeg" required /><span id="photo-metadata-status" class="field-hint">选择照片后将自动读取 EXIF 拍摄时间。</span></label>
            <label>照片类型<select id="photo-type" name="photo_type"><option value="individual">个体照片</option><option value="group">群体照片</option></select></label>
            <label class="individual-field">性别<select name="sex"><option value="unknown">未知</option><option value="male">雄性</option><option value="female">雌性</option></select></label>
            <label class="individual-field">生命阶段<select name="life_stage"><option value="unknown">未知</option><option value="egg">卵</option><option value="chick">雏鸟</option><option value="subadult">亚成</option><option value="adult">成鸟</option></select></label>
            <label class="individual-field">亚种<select id="subspecies-select" name="subspecies"><option value="">未知 / 无亚种</option></select></label>
            <label class="full-field file-field">MP3 录音（可多选）<input name="audio" type="file" accept="audio/mpeg,.mp3" multiple /></label>
          </div></fieldset>
          <fieldset><legend><span>03</span> 照片中的其他物种</legend><div class="form-grid">
            <label class="full-field">选择已有图鉴物种<select id="additional-species-select"><option value="">选择物种</option></select></label>
            <button id="add-additional-species" class="secondary-button full-field" type="button">＋ 添加到这笔观察</button>
            <div id="additional-species-list" class="full-field"></div>
            <p class="field-hint full-field">同一张照片最多记录 10 个物种；每个物种可以分别标记个体或群体、性别、生命阶段和亚种。</p>
          </div></fieldset>
          <fieldset><legend><span>04</span> 时间、地点与环境</legend><div class="form-grid">
            <div class="full-field location-search-field"><label for="location-search">搜索已有地点</label><div class="species-search-control"><input id="location-search" type="search" placeholder="输入地点名称、行政区或地点编号" autocomplete="off" aria-controls="location-search-results" /><div id="location-search-results" class="species-search-results" role="listbox" hidden></div></div><span id="location-search-status" class="field-hint"></span><label>地点资料库<select id="location-select" name="location_id"><option value="">暂不关联地点</option></select></label></div>
            <label>拍摄时间<input id="observed-at" name="observed_at" type="datetime-local" step="60" required /></label><label>季节<select name="season"><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option><option value="other">其他</option></select></label>
            <label>纬度<input id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required /></label><label>经度<input id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required /></label><button id="use-location" type="button" class="secondary-button full-field">使用当前设备位置</button>
            <label>国家代码<input name="country_code" value="CN" required /></label><label>国家名称<input name="country_name" value="中国" required /></label><label>一级行政区代码<input name="admin1_code" placeholder="例如 CN-ZJ" required /></label><label>一级行政区名称<input name="admin1_name" placeholder="例如 浙江省" required /></label><label class="full-field">具体地点<input name="locality" required /></label><label class="full-field">备注<textarea name="notes" rows="3"></textarea></label>
          </div></fieldset>
        </div>
        <footer class="dialog-footer"><span id="form-status" role="status"></span><button type="submit" class="primary-button">保存并入藏</button></footer>
      </form>
    </dialog>
    <div class="v2-editor-scaffold" hidden><span id="record-total"></span><select id="observation-year-filter"></select><select id="observation-month-filter"></select><select id="observation-sort-order"><option value="asc">asc</option></select><select id="observation-location-filter"></select><button id="observation-filter-reset" type="button"></button><div id="observation-empty"></div><div id="observation-groups"></div><dialog id="observation-detail-dialog"><button data-close-observation-detail type="button"></button><div id="observation-detail-content"></div></dialog></div>
    <script src="/static/core.js?v=20260815-2" defer></script><script src="/static/v2-pages.js?v=20260825-1" defer></script><script src="/static/observations.js?v=20260819-2" defer></script><script src="/static/assistant.js?v=20260825-4" defer></script>
  </body>
</html>
