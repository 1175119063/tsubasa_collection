<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>探索地图 · 翼·时光记</title>
    <link rel="stylesheet" href="/static/v2.css?v=20260826-2" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  </head>
  <body class="v2-page" data-page="map">
    <div class="v2-grain" aria-hidden="true"></div>
    <header class="v2-topbar">
      <a class="v2-brand" href="/"><span class="v2-brand-seal"><img src="/static/assets/wing-chronicle-logo.png?v=20260816-1" alt="" /></span><span><strong>翼·时光记</strong><small>EXPLORER'S FIELD JOURNAL</small></span></a>
      <nav class="v2-topnav"><a href="/">探索营地</a><a href="/dex">鸟类调查册</a><a href="/observations">田野记录</a><a class="is-active" href="/locations">区域档案</a><a href="/trips">远征日志</a></nav>
      <a class="v2-stable-link" href="/locations">返回区域档案</a>
    </header>
    <main class="v2-map-layout">
      <aside class="v2-map-sidebar">
        <p class="v2-kicker">REGION EXPLORATION MAP</p><h1>探索地图</h1>
        <p>在同一张地图上查看全部区域档案。相邻点位会自动聚合，缩放后展开。</p>
        <label for="map-location-search">检索区域</label>
        <input id="map-location-search" class="v2-search" type="search" placeholder="地点、城市或行政区" />
        <label for="map-location-type">区域类型</label>
        <select id="map-location-type"><option value="">全部类型</option></select>
        <button class="v2-filter-reset" id="map-location-reset" type="button">清除地图筛选</button>
        <div class="v2-book-count"><strong id="map-location-count">—</strong><span>处地图据点</span></div>
        <div id="map-location-list" class="v2-map-location-list"></div>
      </aside>
      <section class="v2-map-stage"><div id="region-overview-map" aria-label="区域档案地图"></div><p id="map-status">正在展开地图……</p></section>
    </main>
    <script src="/static/core.js?v=20260815-2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/static/map-overview.js?v=20260826-1"></script>
  </body>
</html>
