<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地点浏览 · 翼·时光记</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260822-1" />
  </head>
  <body>
    <div class="paper-noise"></div>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">羽</span><span><strong>翼·时光记</strong><small>地点浏览</small></span></a>
      <div class="top-actions">
        <a class="nav-link" href="/">首页</a><a class="nav-link" href="/observations">观察记录</a><a class="nav-link" href="/dex">个人图鉴</a>
        <button id="new-location-button" class="primary-button">＋ 新增地点</button>
      </div>
    </header>
    <main>
      <section class="page-intro">
        <p class="eyebrow">BIRDING PLACES</p><div><h1>地点浏览</h1><span id="location-total" class="section-count">0 个地点</span></div>
        <p>按公园、湿地与保护区整理观察记录，以到访日回顾你和一片土地的长期联系。</p>
      </section>
      <section class="records-page-section">
        <div class="section-heading location-tools"><p class="section-note">到访日指该地点产生观察记录的不同自然日</p><label class="search-box"><span>⌕</span><input id="location-search" type="search" placeholder="搜索地点名称或行政区" /></label></div>
        <div class="filter-panel location-filters"><label>地点类型<select id="location-type-filter"><option value="">全部类型</option></select></label><button id="location-filter-reset" type="button" class="secondary-button filter-reset">清除筛选</button></div>
        <div id="location-empty" class="empty-state" hidden><span class="empty-feather">⌖</span><h3>地点资料库还是空的</h3><p>建立第一个观鸟地点，并关联已有观察记录。</p><button id="empty-new-location" class="text-button">新增第一个地点 →</button></div>
        <div id="location-filter-empty" class="compact-empty" hidden>当前筛选条件下没有地点。</div>
        <div id="location-grid" class="location-grid"></div>
      </section>
    </main>
    <dialog id="location-form-dialog" class="record-dialog location-form-dialog">
      <form id="location-form">
        <header class="dialog-header"><div><p class="eyebrow">PLACE ARCHIVE</p><h2 id="location-form-title">新增观鸟地点</h2></div><button type="button" class="icon-button" data-close-location-form aria-label="关闭">×</button></header>
        <div class="form-scroll">
          <fieldset><legend><span>01</span> 基本资料</legend><div class="form-grid">
            <label class="full-field">地点名称<input name="name" required placeholder="例如 天坛公园" /></label>
            <label>地点类型<select name="location_type" required></select></label><label>建议匹配半径（米）<input name="radius_meters" type="number" min="1" step="any" placeholder="可不填" /></label>
            <label>国家代码<input name="country_code" value="CN" required /></label><label>国家名称<input name="country_name" value="中国" required /></label>
            <label>一级行政区代码<input name="admin1_code" placeholder="例如 CN-BJ" required /></label><label>一级行政区名称<input name="admin1_name" placeholder="例如 北京市" required /></label>
            <label>城市<input name="city" /></label><label>区县<input name="district" /></label>
          </div></fieldset>
          <fieldset><legend><span>02</span> 中心位置</legend><div class="form-grid">
            <section class="location-map-picker full-field" aria-labelledby="location-map-heading"><div class="location-map-search"><label for="location-map-search"><span id="location-map-heading">搜索地图地点</span><input id="location-map-search" type="search" placeholder="例如：山东大学兴隆山校区" autocomplete="off" /></label><button id="location-map-search-button" type="button" class="secondary-button">搜索</button></div><p id="location-map-status" class="field-hint" role="status">可以搜索地点，也可以直接点击地图选择中心点。</p><div id="location-map" aria-label="地点选择地图"></div><div id="location-map-results" class="location-map-results"></div></section>
            <label>中心纬度<input name="center_latitude" type="number" min="-90" max="90" step="any" required /></label><label>中心经度<input name="center_longitude" type="number" min="-180" max="180" step="any" required /></label>
            <label class="full-field">坐标系统<select name="coordinate_system"><option value="wgs84">WGS-84（设备定位、照片坐标）</option><option value="gcj02">GCJ-02（高德地图）</option></select></label>
            <button id="use-location-center" type="button" class="secondary-button full-field">使用当前设备位置作为中心点</button>
            <label class="full-field">地点备注<textarea name="notes" rows="4"></textarea></label>
            <label id="auto-link-field" class="check-field full-field"><input name="link_matching_records" type="checkbox" checked /><span>自动关联同省份、地点名称完全相同的已有观察</span></label>
          </div></fieldset>
        </div>
        <footer class="dialog-footer"><span id="location-form-status" role="status"></span><button type="submit" class="primary-button">保存地点</button></footer>
      </form>
    </dialog>
    <dialog id="location-detail-dialog" class="detail-dialog location-detail-dialog"><button type="button" class="detail-close" data-close-location-detail aria-label="关闭">×</button><div id="location-detail-content"></div></dialog>
    <dialog id="location-link-dialog" class="record-dialog location-link-dialog">
      <form id="location-link-form"><header class="dialog-header"><div><p class="eyebrow">LINK RECORDS</p><h2>关联已有观察</h2></div><button type="button" class="icon-button" data-close-location-link aria-label="关闭">×</button></header>
        <div class="form-scroll"><p class="section-note">勾选属于当前地点的记录。已属于其他地点的记录被勾选后将移动到这里。</p><div id="location-link-list" class="location-link-list"></div></div>
        <footer class="dialog-footer"><span id="location-link-status" role="status"></span><button type="submit" class="primary-button">保存关联</button></footer>
      </form>
    </dialog>
    <input id="location-cover-input" type="file" accept="image/jpeg,.jpg,.jpeg" hidden />
    <script src="/static/core.js?v=20260815-1" defer></script><script src="/static/locations.js?v=20260822-1" defer></script>
  </body>
</html>
