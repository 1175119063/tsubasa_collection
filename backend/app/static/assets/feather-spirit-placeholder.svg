    <path d="M131 93c26-29 55-21 67-10-25 1-38 12-50 29 24-16 43-10 53-2-25 5-37 17-51 35 21-9 36-2 44 7-25 1-45 14-63 35z"/>
    <ellipse cx="128" cy="126" rx="18" ry="27"/>
    <circle cx="128" cy="91" r="14"/>
    <path d="M119 151l-10 47 19-24 19 24-10-47z"/>
