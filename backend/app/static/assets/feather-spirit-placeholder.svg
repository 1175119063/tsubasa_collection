<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">飞羽精灵占位头像</title>
  <desc id="desc">环绕着星光与羽翼的精灵剪影占位图</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#6551a6"/>
      <stop offset="0.58" stop-color="#29254f"/>
      <stop offset="1" stop-color="#15132d"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfff5"/>
      <stop offset="0.5" stop-color="#8de3d2"/>
      <stop offset="1" stop-color="#b99beb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#sky)" stroke="#e8cf85" stroke-width="4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#8de3d2" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 11"/>
