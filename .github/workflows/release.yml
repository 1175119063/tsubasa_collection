name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vue frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: python -m pip install . pyinstaller
      - name: Build portable Windows package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          .\packaging\build-release.ps1 -Version $version
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            packaging/release/*.zip
            packaging/release/SHA256SUMS-*.txt

  build-macos-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vue frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Create macOS Docker deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="${{ inputs.version }}"; else version="${GITHUB_REF_NAME#v}"; fi
          bundle="翼·时光记-macOS-Docker-v${version}"
          mkdir -p "packaging/release/${bundle}"
          cp pyproject.toml packaging/macos/Dockerfile packaging/macos/docker-compose.yml packaging/macos/README-zh-CN.md "packaging/release/${bundle}/"
          cp -R backend "packaging/release/${bundle}/backend"
          printf '翼·时光记 macOS Docker v%s\n' "$version" > "packaging/release/${bundle}/VERSION.txt"
          tar -czf "packaging/release/${bundle}.tar.gz" -C packaging/release "$bundle"
          shasum -a 256 "packaging/release/${bundle}.tar.gz" > "packaging/release/SHA256SUMS-macOS-v${version}.txt"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-docker-package
          path: |
            packaging/release/*.tar.gz
            packaging/release/SHA256SUMS-*.txt

  publish:
    needs: [build-windows, build-macos-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: assets/*
