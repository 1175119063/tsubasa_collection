name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install ".[dev]"
      - name: Lint backend and tests
        run: python -m ruff check backend tests
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check Vue and TypeScript
        working-directory: frontend
        run: npx vue-tsc -b
      - name: Build frontend for page route tests
        working-directory: frontend
        run: npx vite build
      - name: Run non-browser tests
        run: python -m pytest -m "not browser" -q
